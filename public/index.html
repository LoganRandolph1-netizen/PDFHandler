<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Scanner Q&A</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #23232f;
      --border: #2e2e3d;
      --accent: #7c6aff;
      --accent-hover: #9b8dff;
      --accent-dim: rgba(124, 106, 255, 0.15);
      --text: #e8e8f0;
      --text-muted: #888899;
      --success: #34d399;
      --error: #f87171;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bff, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 760px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* ── Upload Zone ── */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    #drop-zone:hover,
    #drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    #drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    #drop-zone p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    #drop-zone strong {
      color: var(--accent);
    }

    /* ── PDF Info Banner ── */
    #pdf-info {
      display: none;
      align-items: center;
      gap: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      margin-top: 16px;
    }

    #pdf-info.visible { display: flex; }

    .pdf-icon {
      font-size: 1.6rem;
      flex-shrink: 0;
    }

    .pdf-meta { flex: 1; min-width: 0; }
    .pdf-meta .pdf-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pdf-meta .pdf-stats {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .badge {
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.3);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
    }

    /* ── Upload Progress ── */
    #upload-status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* ── Q&A Section ── */
    #qa-section {
      display: none;
    }
    #qa-section.visible { display: block; }

    .input-row {
      display: flex;
      gap: 10px;
    }

    #question-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
      min-height: 52px;
      max-height: 140px;
      font-family: inherit;
      line-height: 1.5;
    }

    #question-input::placeholder { color: var(--text-muted); }

    #question-input:focus {
      border-color: var(--accent);
    }

    #ask-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
      align-self: flex-end;
      height: 52px;
    }

    #ask-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #ask-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Answer Box ── */
    #answer-box {
      margin-top: 20px;
      min-height: 100px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      transition: border-color 0.2s;
      position: relative;
    }

    #answer-box.streaming {
      border-color: var(--accent);
    }

    #answer-box .placeholder {
      color: var(--text-muted);
      font-style: italic;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.9s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ── History ── */
    #history-section {
      display: none;
      width: 100%;
      max-width: 760px;
    }
    #history-section.visible { display: block; }

    .history-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      margin-bottom: 12px;
    }

    .history-q {
      font-weight: 600;
      color: var(--accent-hover);
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .history-a {
      color: var(--text);
      font-size: 0.88rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    /* ── Error ── */
    .error-msg {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 10px;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>PDF Scanner Q&A</h1>
    <p>Upload a PDF, ask anything — get instant answers from the document</p>
  </header>

  <!-- Upload Card -->
  <div class="card">
    <div class="card-title">1 &mdash; Upload PDF</div>
    <div id="drop-zone">
      <input type="file" id="file-input" accept="application/pdf" />
      <div class="upload-icon">📄</div>
      <p><strong>Click to choose</strong> or drag &amp; drop your PDF here</p>
      <p style="margin-top:6px;font-size:0.8rem;">Max 20 MB</p>
    </div>

    <div id="upload-status"></div>

    <div id="pdf-info">
      <span class="pdf-icon">📑</span>
      <div class="pdf-meta">
        <div class="pdf-name" id="pdf-name"></div>
        <div class="pdf-stats" id="pdf-stats"></div>
      </div>
      <span class="badge">Ready</span>
    </div>
  </div>

  <!-- Q&A Card -->
  <div class="card" id="qa-section">
    <div class="card-title">2 &mdash; Ask a Question</div>
    <div class="input-row">
      <textarea
        id="question-input"
        placeholder="Type your question about the PDF…"
        rows="1"
      ></textarea>
      <button id="ask-btn" disabled>Ask</button>
    </div>
    <div id="error-msg" class="error-msg"></div>

    <div id="answer-box">
      <span class="placeholder">Your answer will appear here…</span>
    </div>
  </div>

  <!-- History -->
  <div id="history-section">
    <div class="history-title">Previous Questions</div>
    <div id="history-list"></div>
  </div>

  <script>
    const SESSION_KEY = 'pdfSessionId';
    let sessionId = null;

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadStatus = document.getElementById('upload-status');
    const pdfInfo = document.getElementById('pdf-info');
    const pdfName = document.getElementById('pdf-name');
    const pdfStats = document.getElementById('pdf-stats');
    const qaSection = document.getElementById('qa-section');
    const questionInput = document.getElementById('question-input');
    const askBtn = document.getElementById('ask-btn');
    const answerBox = document.getElementById('answer-box');
    const errorMsg = document.getElementById('error-msg');
    const historySection = document.getElementById('history-section');
    const historyList = document.getElementById('history-list');

    // Auto-resize textarea
    questionInput.addEventListener('input', () => {
      questionInput.style.height = 'auto';
      questionInput.style.height = Math.min(questionInput.scrollHeight, 140) + 'px';
    });

    // Drag & drop
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) uploadPDF(file);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) uploadPDF(fileInput.files[0]);
    });

    async function uploadPDF(file) {
      if (file.type !== 'application/pdf') {
        setUploadStatus('error', 'Please select a PDF file.');
        return;
      }

      setUploadStatus('loading', 'Scanning PDF…');
      pdfInfo.classList.remove('visible');
      qaSection.classList.remove('visible');
      resetAnswer();

      const formData = new FormData();
      formData.append('pdf', file);

      // Generate a session ID for this upload
      sessionId = 'sess_' + Date.now();

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'x-session-id': sessionId },
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) {
          setUploadStatus('error', data.error || 'Upload failed.');
          return;
        }

        sessionId = data.sessionId;
        setUploadStatus('success', '');

        pdfName.textContent = data.filename;
        pdfStats.textContent = `${data.pages} page${data.pages !== 1 ? 's' : ''} · ${(data.charCount / 1000).toFixed(1)}k characters extracted`;
        pdfInfo.classList.add('visible');

        qaSection.classList.add('visible');
        askBtn.disabled = false;
        questionInput.focus();
      } catch (err) {
        setUploadStatus('error', 'Network error — could not reach the server.');
      }
    }

    function setUploadStatus(type, msg) {
      if (type === 'loading') {
        uploadStatus.innerHTML = `<span class="spinner"></span>${msg}`;
      } else if (type === 'error') {
        uploadStatus.innerHTML = `<span style="color:var(--error)">${msg}</span>`;
      } else {
        uploadStatus.innerHTML = '';
      }
    }

    // Submit on Enter (Shift+Enter for newline)
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!askBtn.disabled) askQuestion();
      }
    });

    askBtn.addEventListener('click', askQuestion);

    async function askQuestion() {
      const question = questionInput.value.trim();
      if (!question || !sessionId) return;

      errorMsg.textContent = '';
      askBtn.disabled = true;
      resetAnswer();

      answerBox.classList.add('streaming');
      answerBox.textContent = '';
      const cursorEl = document.createElement('span');
      cursorEl.className = 'cursor';
      answerBox.appendChild(cursorEl);

      let fullAnswer = '';

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, question }),
        });

        if (!res.ok) {
          const data = await res.json();
          showError(data.error || 'Request failed.');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6).trim();
            if (raw === '[DONE]') break;
            try {
              const parsed = JSON.parse(raw);
              if (parsed.error) { showError(parsed.error); return; }
              if (parsed.text) {
                fullAnswer += parsed.text;
                answerBox.textContent = fullAnswer;
                answerBox.appendChild(cursorEl);
              }
            } catch {}
          }
        }

        cursorEl.remove();
        answerBox.classList.remove('streaming');

        if (fullAnswer) {
          addToHistory(question, fullAnswer);
          questionInput.value = '';
          questionInput.style.height = 'auto';
        }
      } catch (err) {
        showError('Connection error — please try again.');
      } finally {
        askBtn.disabled = false;
        questionInput.focus();
      }
    }

    function resetAnswer() {
      answerBox.classList.remove('streaming');
      answerBox.innerHTML = '<span class="placeholder">Your answer will appear here…</span>';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      resetAnswer();
      askBtn.disabled = false;
    }

    function addToHistory(question, answer) {
      historySection.classList.add('visible');
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <div class="history-q">Q: ${escapeHtml(question)}</div>
        <div class="history-a">${escapeHtml(answer)}</div>
      `;
      historyList.prepend(item);
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
